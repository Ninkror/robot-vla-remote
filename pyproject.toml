[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-vla"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["grpcio==1.73.1", "numpy==2.2.6", "protobuf==6.31.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
